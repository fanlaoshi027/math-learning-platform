name: Mosuan Board v0.2.2 DMG

on:
  push:
    branches:
      - mosuan-v0.2.1-from-working-base
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Apply Noteful-targeted ink repair
        run: python3 scripts/fix-mosuan-ink-quality.py
      - name: Apply UI synchronization repair
        run: python3 scripts/fix-mosuan-ui-loop.py
      - name: Apply packaged Metal resource lookup repair
        run: python3 scripts/fix-mosuan-runtime-resources.py
      - name: Apply Swift type-check repair
        run: python3 scripts/fix-mosuan-swift-typecheck.py
      - name: Resolve package
        run: swift package resolve
      - name: Build release
        run: swift build -c release
      - name: Create app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          rm -rf "$APP" DMG
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" DMG
          cp .build/release/MosuanBoard "$APP/Contents/MacOS/MosuanBoard"
          chmod +x "$APP/Contents/MacOS/MosuanBoard"
          RESOURCE_BUNDLE="$(find .build -type d -name 'MosuanBoard_MosuanBoard.bundle' -print -quit)"
          test -n "$RESOURCE_BUNDLE"
          cp -R "$RESOURCE_BUNDLE" "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleDisplayName</key><string>墨算</string>
              <key>CFBundleExecutable</key><string>MosuanBoard</string>
              <key>CFBundleIdentifier</key><string>com.fanlaoshi.mosuan-board</string>
              <key>CFBundleName</key><string>Mosuan Board</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.2.2</string>
              <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
      - name: Compile Metal library
        shell: bash
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          BUNDLE="$APP/Contents/Resources/MosuanBoard_MosuanBoard.bundle"
          test -d "$BUNDLE"
          AIR="/tmp/MosuanBoard-InkShaders.air"
          METALLIB="$BUNDLE/default.metallib"
          xcrun -sdk macosx metal -mmacosx-version-min=14.0 -c Sources/MosuanBoard/Metal/InkShaders.metal -o "$AIR"
          xcrun -sdk macosx metallib "$AIR" -o "$METALLIB"
          test -s "$METALLIB"
      - name: Ad-hoc sign and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -x "$APP/Contents/MacOS/MosuanBoard"
          test -f "$APP/Contents/Resources/MosuanBoard_MosuanBoard.bundle/default.metallib"
          plutil -lint "$APP/Contents/Info.plist"
      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          rm -rf DMG && mkdir -p DMG
          cp -R "$APP" DMG/
          ln -s /Applications DMG/Applications
          hdiutil create -volname "墨算 0.2.2" -srcfolder DMG -ov -format UDZO "MosuanBoard-0.2.2-${GITHUB_RUN_NUMBER}.dmg"
          hdiutil verify "MosuanBoard-0.2.2-${GITHUB_RUN_NUMBER}.dmg"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MosuanBoard-0.2.2-dmg
          path: MosuanBoard-0.2.2-${{ github.run_number }}.dmg
          if-no-files-found: error
