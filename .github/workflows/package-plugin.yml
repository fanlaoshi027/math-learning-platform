name: Package MathCourse Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist
          cd wp/wp-content/plugins
          zip -r ../../../dist/math-course.zip math-course -x 'math-course/.DS_Store' 'math-course/*.log'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: math-course
          path: dist/math-course.zip
          if-no-files-found: error
