name: Apply Ink Realtime V3

on:
  push:
    branches:
      - smart-line-v1

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    if: ${{ !startsWith(github.event.head_commit.message, 'perf: ink realtime v3') }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch realtime ink renderer
        run: |
          python3 <<'PY'
          from pathlib import Path

          metal = Path('Sources/MosuanBoard/Metal/InkRenderer.swift')
          text = metal.read_text()
          old = 'for p in s { disk(viewPoint(from:SIMD2(p.x,p.y)), strokeWidth(p.pressure,style), color, to:&out) }'
          new = '''if let first = s.first {
              disk(viewPoint(from: SIMD2(first.x, first.y)), strokeWidth(first.pressure, style), color, to: &out)
          }
          if let last = s.last, s.count > 1 {
              disk(viewPoint(from: SIMD2(last.x, last.y)), strokeWidth(last.pressure, style), color, to: &out)
          }'''
          if old in text:
              metal.write_text(text.replace(old, new, 1))
          elif 'if let first = s.first {' not in text:
              raise SystemExit('InkRenderer optimization anchor not found')

          view = Path('Sources/MosuanBoard/Metal/InkMetalView.swift')
          text = view.read_text()
          prop_anchor = '    private var polygonModel = PolygonToolModel()\n'
          prop = '''    private var polygonModel = PolygonToolModel()
    private var inkDynamics = MosuanInkDynamics()
'''
          if 'private var inkDynamics = MosuanInkDynamics()' not in text:
              if prop_anchor not in text:
                  raise SystemExit('InkMetalView property anchor not found')
              text = text.replace(prop_anchor, prop, 1)

          helper_anchor = '    private var selectionModeActive: Bool { isSelectionTool || temporarySelectHeld }\n'
          helper = '''    private var selectionModeActive: Bool { isSelectionTool || temporarySelectHeld }

    private func resolvedInkPressure(for event: NSEvent, position: SIMD2<Float>, phase: MosuanPointerEvent.Phase) -> Float {
        let raw = Float(event.pressure)
        if raw > 0.001 && raw < 0.999 {
            return raw
        }
        return inkDynamics.syntheticPressure(position: position, timestamp: event.timestamp, phase: phase)
    }
'''
          if 'private func resolvedInkPressure' not in text:
              if helper_anchor not in text:
                  raise SystemExit('InkMetalView helper anchor not found')
              text = text.replace(helper_anchor, helper, 1)

          old = 'points = [InkPoint(x: c.x, y: c.y, pressure: event.pressure > 0 ? Float(event.pressure) : 1)]'
          new = 'points = [InkPoint(x: c.x, y: c.y, pressure: resolvedInkPressure(for: event, position: c, phase: .began))]'
          if old in text:
              text = text.replace(old, new, 1)

          old = 'let pressure = event.pressure > 0 ? Float(event.pressure) : (points.last?.pressure ?? 1)'
          new = 'let pressure = resolvedInkPressure(for: event, position: c, phase: .changed)'
          if old in text:
              text = text.replace(old, new)

          view.write_text(text)
          print('patched realtime ink v3')
          PY

      - name: Build release
        run: swift build -c release

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/MosuanBoard/Metal/InkRenderer.swift Sources/MosuanBoard/Metal/InkMetalView.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "perf: ink realtime v3"
            git push origin HEAD:smart-line-v1
          fi

      - name: Trigger test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mosuan-test-build.yml --ref smart-line-v1
