name: Mosuan DMG Build

on:
  push:
    branches:
      - smart-line-v1

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply realtime ink optimization
        run: |
          python3 <<'PY'
          from pathlib import Path
          metal = Path('Sources/MosuanBoard/Metal/InkRenderer.swift')
          text = metal.read_text()
          old = 'for p in s { disk(viewPoint(from:SIMD2(p.x,p.y)), strokeWidth(p.pressure,style), color, to:&out) }'
          new = '''if let first = s.first {
              disk(viewPoint(from: SIMD2(first.x, first.y)), strokeWidth(first.pressure, style), color, to: &out)
          }
          if let last = s.last, s.count > 1 {
              disk(viewPoint(from: SIMD2(last.x, last.y)), strokeWidth(last.pressure, style), color, to: &out)
          }'''
          if old in text:
              metal.write_text(text.replace(old, new, 1))
          elif 'if let first = s.first {' not in text:
              raise SystemExit('InkRenderer optimization anchor not found')

          view = Path('Sources/MosuanBoard/Metal/InkMetalView.swift')
          text = view.read_text()
          prop_anchor = '    private var polygonModel = PolygonToolModel()\n'
          if 'private var inkDynamics = MosuanInkDynamics()' not in text:
              if prop_anchor not in text:
                  raise SystemExit('InkMetalView property anchor not found')
              text = text.replace(prop_anchor, prop_anchor + '    private var inkDynamics = MosuanInkDynamics()\n', 1)
          helper_anchor = '    private var selectionModeActive: Bool { isSelectionTool || temporarySelectHeld }\n'
          if 'private func resolvedInkPressure' not in text:
              helper = '''    private var selectionModeActive: Bool { isSelectionTool || temporarySelectHeld }

    private func resolvedInkPressure(for event: NSEvent, position: SIMD2<Float>, phase: MosuanPointerEvent.Phase) -> Float {
        let raw = Float(event.pressure)
        if raw > 0.001 && raw < 0.999 { return raw }
        return inkDynamics.syntheticPressure(position: position, timestamp: event.timestamp, phase: phase)
    }
'''
              if helper_anchor not in text:
                  raise SystemExit('InkMetalView helper anchor not found')
              text = text.replace(helper_anchor, helper, 1)
          old = 'points = [InkPoint(x: c.x, y: c.y, pressure: event.pressure > 0 ? Float(event.pressure) : 1)]'
          new = 'points = [InkPoint(x: c.x, y: c.y, pressure: resolvedInkPressure(for: event, position: c, phase: .began))]'
          if old in text: text = text.replace(old, new, 1)
          old = 'let pressure = event.pressure > 0 ? Float(event.pressure) : (points.last?.pressure ?? 1)'
          new = 'let pressure = resolvedInkPressure(for: event, position: c, phase: .changed)'
          if old in text: text = text.replace(old, new)
          view.write_text(text)
          PY

      - name: Resolve packages
        run: swift package resolve

      - name: Build app
        run: swift build -c release

      - name: Create macOS app bundle and DMG
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          DMG="Mosuan-${GITHUB_REF_NAME}.dmg"
          BIN_PATH="$(swift build -c release --show-bin-path)"

          rm -rf "$APP" DMG "$DMG" AppIcon.iconset AppIcon.icns
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_PATH/MosuanBoard" "$APP/Contents/MacOS/MosuanBoard"
          chmod +x "$APP/Contents/MacOS/MosuanBoard"

          RESOURCE_BUNDLE="$BIN_PATH/MosuanBoard_MosuanBoard.bundle"
          if [ ! -d "$RESOURCE_BUNDLE" ]; then
            RESOURCE_BUNDLE="$(find .build -type d -name 'MosuanBoard_MosuanBoard.bundle' -print -quit)"
          fi
          test -n "$RESOURCE_BUNDLE"
          test -d "$RESOURCE_BUNDLE"
          echo "Using SwiftPM resource bundle: $RESOURCE_BUNDLE"
          find "$RESOURCE_BUNDLE" -maxdepth 3 -print

          cp -R "$RESOURCE_BUNDLE" "$APP/Contents/Resources/"
          cp Sources/MosuanBoard/Metal/InkShaders.metal "$APP/Contents/Resources/InkShaders.metal"

          cat > /tmp/make-mosuan-icon.swift <<'SWIFT'
          import AppKit
          import Foundation
          let sizes: [(Int, String)] = [
              (16, "16x16"), (32, "16x16@2x"), (32, "32x32"), (64, "32x32@2x"),
              (128, "128x128"), (256, "128x128@2x"), (256, "256x256"),
              (512, "256x256@2x"), (512, "512x512"), (1024, "512x512@2x")
          ]
          let fm = FileManager.default
          let iconset = URL(fileURLWithPath: "AppIcon.iconset", isDirectory: true)
          try fm.createDirectory(at: iconset, withIntermediateDirectories: true)
          for (size, name) in sizes {
              let image = NSImage(size: NSSize(width: size, height: size))
              image.lockFocusFlipped(false)
              NSColor(calibratedRed: 0.035, green: 0.085, blue: 0.16, alpha: 1).setFill()
              NSBezierPath(roundedRect: NSRect(x: 0, y: 0, width: size, height: size), xRadius: CGFloat(size) * 0.22, yRadius: CGFloat(size) * 0.22).fill()
              let inset = CGFloat(size) * 0.16
              NSColor(calibratedRed: 0.98, green: 0.52, blue: 0.16, alpha: 1).setStroke()
              let line = NSBezierPath(); line.lineWidth = max(1, CGFloat(size) * 0.055); line.lineCapStyle = .round
              line.move(to: NSPoint(x: inset, y: CGFloat(size) * 0.27)); line.line(to: NSPoint(x: CGFloat(size) * 0.50, y: CGFloat(size) * 0.73)); line.line(to: NSPoint(x: CGFloat(size) * 0.84, y: CGFloat(size) * 0.30)); line.stroke()
              NSColor.white.setStroke()
              let axis = NSBezierPath(); axis.lineWidth = max(1, CGFloat(size) * 0.035)
              axis.move(to: NSPoint(x: CGFloat(size) * 0.18, y: CGFloat(size) * 0.50)); axis.line(to: NSPoint(x: CGFloat(size) * 0.82, y: CGFloat(size) * 0.50)); axis.stroke()
              image.unlockFocus()
              guard let tiff = image.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) else { fatalError("PNG generation failed") }
              try png.write(to: iconset.appendingPathComponent("icon_\(name).png"))
          }
          SWIFT
          xcrun swift /tmp/make-mosuan-icon.swift
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleDisplayName</key><string>墨算</string>
              <key>CFBundleExecutable</key><string>MosuanBoard</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleIconName</key><string>AppIcon</string>
              <key>CFBundleIdentifier</key><string>com.fanlaoshi.mosuanboard</string>
              <key>CFBundleName</key><string>墨算</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          python3 - <<'PY'
          from pathlib import Path
          p = Path("Sources/MosuanBoard/Metal/InkRenderer.swift")
          s = p.read_text()
          old = "device.makeDefaultLibrary(bundle: Bundle.module)"
          new = "device.makeDefaultLibrary(bundle: Bundle(path: Bundle.main.bundleURL.appendingPathComponent(\"Contents/Resources/MosuanBoard_MosuanBoard.bundle\").path) ?? Bundle.main)"
          if old not in s:
              raise SystemExit("expected shader bundle lookup not found")
          p.write_text(s.replace(old, new, 1))
          PY
          swift build -c release
          cp "$(swift build -c release --show-bin-path)/MosuanBoard" "$APP/Contents/MacOS/MosuanBoard"
          chmod +x "$APP/Contents/MacOS/MosuanBoard"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          test -d "$APP/Contents/Resources/MosuanBoard_MosuanBoard.bundle"
          test -f "$APP/Contents/Resources/InkShaders.metal"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -x "$APP/Contents/MacOS/MosuanBoard"
          test ! -d "$APP/Contents/MacOS/MosuanBoard_MosuanBoard.bundle"

          mkdir -p DMG
          cp -R "$APP" DMG/
          ln -s /Applications DMG/Applications
          hdiutil create -volname "墨算" -srcfolder DMG -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

          MOUNT_POINT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true; rm -rf "$MOUNT_POINT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          test -d "$MOUNT_POINT/Mosuan Board.app/Contents/Resources/MosuanBoard_MosuanBoard.bundle"
          test -f "$MOUNT_POINT/Mosuan Board.app/Contents/Resources/InkShaders.metal"
          test -f "$MOUNT_POINT/Mosuan Board.app/Contents/Resources/AppIcon.icns"
          test -x "$MOUNT_POINT/Mosuan Board.app/Contents/MacOS/MosuanBoard"
          test ! -d "$MOUNT_POINT/Mosuan Board.app/Contents/MacOS/MosuanBoard_MosuanBoard.bundle"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          rm -rf "$MOUNT_POINT"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MosuanBoard-${{ github.ref_name }}-dmg
          path: Mosuan-${{ github.ref_name }}.dmg

