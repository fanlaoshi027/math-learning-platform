name: Mosuan DMG Build
on:
  push:
    branches:
      - smart-line-v1
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve packages
        run: swift package resolve
      - name: Build app
        run: swift build -c release
      - name: Create macOS app bundle and DMG
        run: |
          set -euo pipefail
          APP="Mosuan Board.app"
          DMG="Mosuan-${GITHUB_REF_NAME}.dmg"
          rm -rf "$APP" DMG "$DMG"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/MosuanBoard "$APP/Contents/MacOS/MosuanBoard"
          chmod +x "$APP/Contents/MacOS/MosuanBoard"

          # SwiftPM's Bundle.module resources are emitted as a resource bundle.
          # Keep that bundle inside the app so Bundle.module can resolve it at runtime.
          RESOURCE_BUNDLE=".build/release/MosuanBoard_MosuanBoard.bundle"
          if [ ! -d "$RESOURCE_BUNDLE" ]; then
            RESOURCE_BUNDLE="$(find .build -type d -name 'MosuanBoard_MosuanBoard.bundle' -print -quit)"
          fi
          test -n "$RESOURCE_BUNDLE"
          test -d "$RESOURCE_BUNDLE"
          cp -R "$RESOURCE_BUNDLE" "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key><string>墨算</string>
              <key>CFBundleExecutable</key><string>MosuanBoard</string>
              <key>CFBundleIdentifier</key><string>com.fanlaoshi.mosuanboard</string>
              <key>CFBundleName</key><string>墨算</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign after all executable/resource contents are in place.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -n 20 || true

          mkdir -p DMG
          cp -R "$APP" DMG/
          ln -s /Applications DMG/Applications
          hdiutil create -volname "墨算" -srcfolder DMG -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

          # Mount the image once in CI to verify the distributed app is present.
          MOUNT_POINT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true; rm -rf "$MOUNT_POINT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          test -d "$MOUNT_POINT/Mosuan Board.app/Contents/Resources/MosuanBoard_MosuanBoard.bundle"
          test -x "$MOUNT_POINT/Mosuan Board.app/Contents/MacOS/MosuanBoard"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          rm -rf "$MOUNT_POINT"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MosuanBoard-${{ github.ref_name }}-dmg
          path: Mosuan-${{ github.ref_name }}.dmg
