name: Vendor ArtPlayer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-artplayer.yml'

permissions:
  contents: write

jobs:
  vendor:
    if: github.ref == 'refs/heads/wpui-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official ArtPlayer
        run: |
          mkdir -p wp/wp-content/plugins/math-course/assets/artplayer
          curl -L --fail --retry 3 https://raw.githubusercontent.com/zhw2590582/ArtPlayer/master/packages/artplayer/dist/artplayer.js -o wp/wp-content/plugins/math-course/assets/artplayer/artplayer.js
          head -n 5 wp/wp-content/plugins/math-course/assets/artplayer/artplayer.js

      - name: Commit vendored ArtPlayer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp/wp-content/plugins/math-course/assets/artplayer/artplayer.js
          if git diff --cached --quiet; then
            echo 'ArtPlayer is already up to date.'
            exit 0
          fi
          git commit -m 'Vendor official ArtPlayer runtime'
          git push
