name: Xournal UI Build

on:
  push:
    branches:
      - xournal-drawboard-ui
  pull_request:
    branches:
      - xournal-drawboard-ui

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Swift version
        run: swift --version
      - name: Resolve packages
        run: swift package resolve
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build -c debug 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xournal-ui-build-log
          path: build.log
          if-no-files-found: ignore
