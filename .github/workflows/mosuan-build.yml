name: Mosuan Board Build

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Normalize Swift 6 parser edge case
        run: perl -0pi -e 's/ry=-p\.x\*si\+p\.y\*co/ry = (-p.x * si) + (p.y * co)/g' Sources/MosuanBoard/Core/GraphicObjectStore.swift
      - name: Guard Metal page-state update loop
        run: python3 scripts/fix-mosuan-ui-loop.py
      - name: Build app bundle and DMG
        id: build
        continue-on-error: true
        run: bash scripts/build-macos-app.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-build-diagnostics
          path: dist/swift-build.log
          if-no-files-found: warn
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Verify release architecture, package and signature
        run: |
          set -e
          file "dist/Mosuan Board.app/Contents/MacOS/MosuanBoard" | grep -q arm64
          test -f "dist/Mosuan Board.app/Contents/Resources/MosuanBoard_MosuanBoard.bundle/default.metallib"
          test -f "dist/Mosuan Board.app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/Mosuan Board.app/Contents/Info.plist" | grep -q 0.1.3
          test -f "dist/Mosuan-Board-0.1.3.dmg"
          codesign --verify --deep --strict --verbose=2 "dist/Mosuan Board.app"
          hdiutil verify "dist/Mosuan-Board-0.1.3.dmg"
      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-app-0.1.3-arm64
          path: dist/Mosuan Board.app
          if-no-files-found: error
      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-0.1.3-arm64.dmg
          path: dist/Mosuan-Board-0.1.3.dmg
          if-no-files-found: error
