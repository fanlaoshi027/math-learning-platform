name: Mosuan Board Build

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  build-macos:
    # Build on Apple Silicon so the release matches the user's Mac architecture.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: swift --version

      - name: Normalize Swift 6 parser edge case
        run: perl -0pi -e 's/ry=-p\.x\*si\+p\.y\*co/ry = (-p.x * si) + (p.y * co)/g' Sources/MosuanBoard/Core/GraphicObjectStore.swift

      - name: Guard Metal page-state update loop
        run: python3 scripts/fix-mosuan-ui-loop.py

      - name: Build app bundle and DMG
        id: build
        continue-on-error: true
        run: bash scripts/build-macos-app.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-build-diagnostics
          path: dist/swift-build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify release architecture and package
        run: |
          set -e
          echo "==> Architecture"
          file "dist/Mosuan Board.app/Contents/MacOS/MosuanBoard"
          file "dist/Mosuan Board.app/Contents/MacOS/MosuanBoard" | grep -q arm64
          echo "==> Metal resource bundle"
          test -d "dist/Mosuan Board.app/Contents/Resources/MosuanBoard_MosuanBoard.bundle"
          echo "==> App icon"
          test -f "dist/Mosuan Board.app/Contents/Resources/AppIcon.icns"
          echo "==> Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/Mosuan Board.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/Mosuan Board.app/Contents/Info.plist"
          echo "==> DMG"
          test -f "dist/Mosuan-Board-0.1.2.dmg"
          ls -lh "dist/Mosuan Board.app" "dist/Mosuan-Board-0.1.2.dmg"

      # GUI/Metal launch is intentionally tested on the user's Mac rather than
      # the hosted runner; the package/resource/architecture checks above are deterministic.
      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-app-0.1.2-arm64
          path: dist/Mosuan Board.app
          if-no-files-found: error

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-0.1.2-arm64.dmg
          path: dist/Mosuan-Board-0.1.2.dmg
          if-no-files-found: error
