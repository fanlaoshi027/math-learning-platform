name: Mosuan Board Build

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: swift --version

      - name: Apply Swift type-check fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Sources/MosuanBoard/Metal/InkRenderer.swift")
          s = p.read_text()
          old = "        var previous = v + SIMD2(cos(startAngle), sin(startAngle)) * Float(radius)"
          new = "        let startCos = Float(cos(startAngle))\n        let startSin = Float(sin(startAngle))\n        let startVector = SIMD2<Float>(startCos, startSin)\n        var previous = v + startVector * Float(radius)"
          if old not in s:
              raise SystemExit("expected dynamic-angle expression not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build app bundle and DMG
        run: bash scripts/build-macos-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-app
          path: dist/Mosuan Board.app
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-dmg
          path: dist/Mosuan-Board-0.1.0.dmg
          if-no-files-found: error
