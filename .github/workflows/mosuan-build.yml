name: Mosuan Board Build

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: swift --version

      - name: Build app bundle and DMG
        id: build
        continue-on-error: true
        run: bash scripts/build-macos-app.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-build-diagnostics
          path: dist/swift-build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-app
          path: dist/Mosuan Board.app
          if-no-files-found: error

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-0.1.0.dmg
          path: dist/Mosuan-Board-0.1.0.dmg
          if-no-files-found: error
