name: Mosuan Runner Diagnostic

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  diagnose-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Runner diagnostic
        run: |
          echo "=== Ubuntu runner started ==="
          date -u
          uname -a
          echo "Architecture: $(uname -m)"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

  diagnose-macos:
    runs-on: macos-15
    steps:
      - name: Runner diagnostic
        run: |
          echo "=== macOS runner started ==="
          date -u
          sw_vers
          uname -a
          echo "Architecture: $(uname -m)"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
