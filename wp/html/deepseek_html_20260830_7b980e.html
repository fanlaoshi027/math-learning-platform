<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>樊老师数学 - 后台管理</title>
<style>
body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; }
/* 左侧侧边栏 */
.admin-sidebar { width: 220px; background: #001529; color: #fff; height: 100vh; }
.admin-logo { padding: 20px; font-size: 20px; font-weight: bold; background: #002140; }
.admin-menu { padding: 0; list-style: none; }
.admin-menu li { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); }
.admin-menu li:hover { background: #1890ff; }
.admin-menu li.active { background: #1890ff; }

/* 主体内容 */
.admin-main { flex: 1; padding: 20px; }
.admin-header { background: #fff; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

/* 看板卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
.stat-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.stat-title { color: #999; font-size: 14px; margin-bottom: 10px; }
.stat-num { font-size: 28px; font-weight: bold; }

/* 后台表格 */
.table-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.table-tools { display: flex; justify-content: space-between; margin-bottom: 15px; }
.btn-primary { background: #1890ff; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
.btn-danger { background: #ff4d4f; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #fafafa; font-weight: bold; }
</style>
</head>
<body>

<div class="admin-sidebar">
    <div class="admin-logo">樊老师数学后台</div>
    <ul class="admin-menu">
        <li class="active">后台仪表盘</li>
        <li>专题课程管理</li>
        <li>教辅配置页管理</li>
        <li>课程学习管理</li>
        <li>订单/用户管理</li>
    </ul>
</div>

<div class="admin-main">
    <div class="admin-header">当前位置：后台仪表盘</div>

    <!-- 数据看板（对应图2的图表数据） -->
    <div class="stat-grid">
        <div class="stat-card"><div class="stat-title">今日听课学生</div><div class="stat-num">24</div></div>
        <div class="stat-card"><div class="stat-title">今日新增评论</div><div class="stat-num">186</div></div>
        <div class="stat-card"><div class="stat-title">今日学习时长</div><div class="stat-num">532分钟</div></div>
        <div class="stat-card"><div class="stat-title">今日新增课程</div><div class="stat-num">1,206</div></div>
    </div>

    <!-- 课程管理列表（对应图2的表格） -->
    <div class="table-card">
        <div class="table-tools">
            <h3>专题课程管理</h3>
            <button class="btn-primary">+ 新增课程</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>课程名称</th>
                    <th>所属分类</th>
                    <th>课时</th>
                    <th>播放次数</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>全等三角形系列</td>
                    <td>专题-几何</td>
                    <td>8</td>
                    <td>1,242</td>
                    <td>已发布</td>
                    <td><button class="btn-primary">编辑</button> <button class="btn-danger">删除</button></td>
                </tr>
                <tr>
                    <td>二次函数基础精讲</td>
                    <td>专题-函数</td>
                    <td>12</td>
                    <td>864</td>
                    <td>已发布</td>
                    <td><button class="btn-primary">编辑</button> <button class="btn-danger">删除</button></td>
                </tr>
                <tr>
                    <td>相似三角形判定</td>
                    <td>专题-几何</td>
                    <td>6</td>
                    <td>322</td>
                    <td>草稿</td>
                    <td><button class="btn-primary">编辑</button> <button class="btn-danger">删除</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
